name: tether-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Signed annotated release tag, for example tether-v0.2.0
        required: true
        type: string
      approved_commit:
        description: Approved 40-character commit SHA; must be current protected main
        required: true
        type: string

permissions: {}

concurrency:
  group: tether-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # Accounts whose current GitHub-registered GPG or SSH signing keys may sign
  # Tether release tags. Changes to this allowlist require normal code review.
  AUTHORIZED_RELEASE_SIGNERS: "miguelrios"
  RELEASE_NODE_VERSION: "24.19.0"
  RELEASE_NPM_VERSION: "12.0.2"
  RELEASE_PYTHON_VERSION: "3.14.0"

jobs:
  identity:
    name: Verify release authority and identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
      release_tag: ${{ steps.identity.outputs.release_tag }}
      release_commit: ${{ steps.identity.outputs.release_commit }}
      prerelease: ${{ steps.identity.outputs.prerelease }}
      npm_dist_tag: ${{ steps.identity.outputs.npm_dist_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - name: Refuse stale release toolchain pins
        run: |
          set -euo pipefail
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 30 \
            --output "$RUNNER_TEMP/node-releases.json" \
            https://nodejs.org/dist/index.json
          npm view npm version --json >"$RUNNER_TEMP/npm-version.json"

          latest_node="$(
            RELEASE_NODE_MAJOR="${RELEASE_NODE_VERSION%%.*}" node <<'NODE'
          const fs = require("node:fs");
          const rows = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/node-releases.json`, "utf8"),
          );
          const prefix = `v${process.env.RELEASE_NODE_MAJOR}.`;
          const release = rows.find(
            (row) => row?.lts && typeof row.version === "string" &&
              row.version.startsWith(prefix),
          );
          if (!release || !/^v\d+\.\d+\.\d+$/.test(release.version)) {
            throw new Error("official Node release index omitted the selected LTS line");
          }
          process.stdout.write(release.version.slice(1));
          NODE
          )"
          latest_npm="$(
            node <<'NODE'
          const fs = require("node:fs");
          const version = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/npm-version.json`, "utf8"),
          );
          if (typeof version !== "string" || !/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error("npm registry returned an invalid latest version");
          }
          process.stdout.write(version);
          NODE
          )"
          if [[ "$RELEASE_NODE_VERSION" != "$latest_node" ]]; then
            echo "::error::Refresh RELEASE_NODE_VERSION to $latest_node before releasing."
            exit 1
          fi
          if [[ "$RELEASE_NPM_VERSION" != "$latest_npm" ]]; then
            echo "::error::Refresh RELEASE_NPM_VERSION to $latest_npm before releasing."
            exit 1
          fi
      - name: Verify protected main, approved commit, tag, and signer
        id: identity
        env:
          APPROVED_RELEASE_COMMIT: ${{ inputs.approved_commit }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG_INPUT: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          umask 077

          [[ "$DEFAULT_BRANCH" == "main" ]]
          [[ "$GITHUB_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          [[ "$APPROVED_RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG_INPUT" =~ ^tether-v[0-9A-Za-z.+-]+$ ]]
          [[ "$GITHUB_SHA" == "$APPROVED_RELEASE_COMMIT" ]]

          git fetch --force --no-tags origin \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          main_commit="$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH^{commit}")"
          [[ "$main_commit" == "$APPROVED_RELEASE_COMMIT" ]]
          [[ "$(git rev-parse "HEAD^{commit}")" == "$APPROVED_RELEASE_COMMIT" ]]

          tag_ref="refs/tags/$RELEASE_TAG_INPUT"
          git fetch --force --no-tags origin "+$tag_ref:$tag_ref"
          git show-ref --verify --quiet "$tag_ref"
          [[ "$(git cat-file -t "$tag_ref")" == "tag" ]]

          tag_object="$(git rev-parse "$tag_ref")"
          tag_commit="$(git rev-parse "$tag_ref^{commit}")"
          [[ "$tag_commit" == "$APPROVED_RELEASE_COMMIT" ]]

          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/git/tags/$tag_object" \
            >"$RUNNER_TEMP/tether-tag.json"
          TAG_COMMIT="$tag_commit" node <<'NODE'
          const fs = require("node:fs");
          const tag = JSON.parse(
            fs.readFileSync(`${process.env.RUNNER_TEMP}/tether-tag.json`, "utf8"),
          );
          if (tag.object?.type !== "commit" || tag.object.sha !== process.env.TAG_COMMIT) {
            throw new Error("annotated tag does not resolve to the approved commit");
          }
          if (tag.verification?.verified !== true) {
            throw new Error(
              `GitHub did not verify the tag signature: ${tag.verification?.reason ?? "unknown"}`,
            );
          }
          if (
            typeof tag.verification.signature !== "string" ||
            typeof tag.verification.payload !== "string"
          ) {
            throw new Error("verified tag response omitted signature evidence");
          }
          NODE

          signer_root="$RUNNER_TEMP/tether-authorized-signers"
          install -d -m 700 "$signer_root" "$signer_root/gpg"
          : >"$signer_root/allowed_signers"
          chmod 600 "$signer_root/allowed_signers"

          for signer in $AUTHORIZED_RELEASE_SIGNERS; do
            [[ "$signer" =~ ^[A-Za-z0-9-]+$ ]]
            gh api "users/$signer/gpg_keys?per_page=100" \
              >"$signer_root/$signer-gpg.json"
            gh api "users/$signer/ssh_signing_keys?per_page=100" \
              >"$signer_root/$signer-ssh.json"
            SIGNER="$signer" SIGNER_ROOT="$signer_root" node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const signer = process.env.SIGNER;
          const root = process.env.SIGNER_ROOT;
          const now = Date.now();

          const gpgKeys = JSON.parse(
            fs.readFileSync(path.join(root, `${signer}-gpg.json`), "utf8"),
          );
          let index = 0;
          for (const key of gpgKeys) {
            if (
              key.revoked === true ||
              key.can_sign !== true ||
              (key.expires_at && Date.parse(key.expires_at) <= now) ||
              typeof key.raw_key !== "string" ||
              !key.raw_key.includes("BEGIN PGP PUBLIC KEY BLOCK")
            ) {
              continue;
            }
            fs.writeFileSync(
              path.join(root, "gpg", `${signer}-${index}.asc`),
              key.raw_key,
              {mode: 0o600},
            );
            index += 1;
          }

          const sshKeys = JSON.parse(
            fs.readFileSync(path.join(root, `${signer}-ssh.json`), "utf8"),
          );
          for (const row of sshKeys) {
            const key = [row.key, row.title]
              .filter((value) => typeof value === "string")
              .map((value) => value.trim().split(/\s+/).slice(0, 2))
              .filter((parts) => parts.length === 2)
              .map((parts) => parts.join(" "))
              .find((value) =>
                /^(?:ssh-(?:ed25519|rsa)|ecdsa-sha2-)[A-Za-z0-9@._+-]*\s+[A-Za-z0-9+/=]+$/.test(
                  value,
                ),
              );
            if (!key) continue;
            fs.appendFileSync(
              path.join(root, "allowed_signers"),
              `${signer} namespaces="git" ${key}\n`,
            );
          }
          NODE
          done

          signature_header="$(
            node -e '
              const tag = require(process.argv[1]);
              process.stdout.write(tag.verification.signature.split("\n", 1)[0]);
            ' "$RUNNER_TEMP/tether-tag.json"
          )"
          verify_output="$signer_root/verify-output.txt"
          case "$signature_header" in
            "-----BEGIN PGP SIGNATURE-----")
              export GNUPGHOME="$signer_root/gnupg-home"
              install -d -m 700 "$GNUPGHOME"
              shopt -s nullglob
              gpg_keys=("$signer_root"/gpg/*.asc)
              ((${#gpg_keys[@]} > 0))
              for key_file in "${gpg_keys[@]}"; do
                gpg --batch --quiet --import "$key_file"
              done
              if ! git verify-tag --raw "$tag_ref" >"$verify_output" 2>&1; then
                cat "$verify_output" >&2
                exit 1
              fi
              grep -Fq "[GNUPG:] VALIDSIG " "$verify_output"
              ;;
            "-----BEGIN SSH SIGNATURE-----")
              [[ -s "$signer_root/allowed_signers" ]]
              if ! git \
                -c gpg.format=ssh \
                -c gpg.ssh.allowedSignersFile="$signer_root/allowed_signers" \
                verify-tag --raw "$tag_ref" >"$verify_output" 2>&1; then
                cat "$verify_output" >&2
                exit 1
              fi
              signer_verified=false
              for signer in $AUTHORIZED_RELEASE_SIGNERS; do
                if grep -Fq "Good \"git\" signature for $signer " "$verify_output"; then
                  signer_verified=true
                fi
              done
              [[ "$signer_verified" == "true" ]]
              ;;
            *)
              echo "::error::Release tags must use an authorized GPG or SSH signature."
              exit 1
              ;;
          esac

          RELEASE_TAG="$RELEASE_TAG_INPUT" \
          RELEASE_COMMIT="$APPROVED_RELEASE_COMMIT" node <<'NODE' >>"$GITHUB_OUTPUT"
          const fs = require("node:fs");
          const pkg = require("./tether/package.json");
          const lock = require("./tether/package-lock.json");
          const marketplace = require("./tether/.agents/plugins/marketplace.json");
          const version = pkg.version;
          const semver =
            /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          const match = semver.exec(version);
          if (!match) throw new Error(`invalid SemVer: ${version}`);
          if (pkg.name !== "@parcha/tether") throw new Error("unexpected package name");
          if (lock.version !== version || lock.packages?.[""]?.version !== version) {
            throw new Error("package-lock version differs");
          }
          if (process.env.RELEASE_TAG !== `tether-v${version}`) {
            throw new Error("tag does not match package version");
          }
          const plugin = marketplace.plugins.find((row) => row.name === "tether");
          if (!/^[0-9a-f]{40}$/.test(plugin?.source?.ref ?? "")) {
            throw new Error("marketplace source must pin a 40-character commit SHA");
          }
          const prerelease = Boolean(match[4]);
          process.stdout.write(`version=${version}\n`);
          process.stdout.write(`release_tag=${process.env.RELEASE_TAG}\n`);
          process.stdout.write(`release_commit=${process.env.RELEASE_COMMIT}\n`);
          process.stdout.write(`prerelease=${prerelease}\n`);
          process.stdout.write(`npm_dist_tag=${prerelease ? "next" : "latest"}\n`);
          NODE

          marketplace_pin="$(
            node -p '
              require("./tether/.agents/plugins/marketplace.json")
                .plugins.find((row) => row.name === "tether").source.ref
            '
          )"
          git cat-file -e "$marketplace_pin^{commit}"
          git merge-base --is-ancestor "$marketplace_pin" "$tag_commit"
      - name: Refuse an existing npm version
        working-directory: tether
        env:
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          npm ping --registry=https://registry.npmjs.org/ >/dev/null
          set +e
          npm view "@parcha/tether@$RELEASE_VERSION" version --json \
            >"$RUNNER_TEMP/tether-npm-view.txt" 2>&1
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "::error::This immutable npm version already exists."
            exit 1
          fi
          if ! grep -q "E404" "$RUNNER_TEMP/tether-npm-view.txt"; then
            cat "$RUNNER_TEMP/tether-npm-view.txt"
            echo "::error::Could not prove that the npm version is unpublished."
            exit 1
          fi

  release-tests:
    name: Test approved release commit
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tether
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.RELEASE_PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - name: Verify exact checkout
        env:
          RELEASE_COMMIT: ${{ needs.identity.outputs.release_commit }}
        run: test "$(git rev-parse "HEAD^{commit}")" = "$RELEASE_COMMIT"
        working-directory: .
      - name: Verify lockfile and run release tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          npm run pack:check

  validate:
    name: Package exact approved commit
    needs: [identity, release-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.package.outputs.tarball }}
      sha256: ${{ steps.package.outputs.sha256 }}
    defaults:
      run:
        working-directory: tether
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.identity.outputs.release_commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.RELEASE_PYTHON_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
      - name: Build, inspect, and smoke-test the package artifact
        id: package
        env:
          RELEASE_COMMIT: ${{ needs.identity.outputs.release_commit }}
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse "HEAD^{commit}")" == "$RELEASE_COMMIT" ]]
          [[ -z "$(git status --porcelain --untracked-files=no)" ]]
          [[ ! -e node_modules ]]
          mkdir -p dist

          npm pack --json --pack-destination dist \
            >"$RUNNER_TEMP/tether-pack.json"
          tarball="$(
            node -e '
              const rows = require(process.argv[1]);
              if (!Array.isArray(rows) || rows.length !== 1 || !rows[0].filename) {
                throw new Error("npm pack did not produce exactly one artifact");
              }
              process.stdout.write(rows[0].filename);
            ' "$RUNNER_TEMP/tether-pack.json"
          )"
          [[ "$tarball" == "parcha-tether-$RELEASE_VERSION.tgz" ]]
          [[ -f "dist/$tarball" && ! -L "dist/$tarball" ]]
          [[ "$(find dist -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 1 ]]

          TETHER_TARBALL_PATH="$PWD/dist/$tarball" \
            bash tests/test_release_tarball.sh

          smoke_root="$RUNNER_TEMP/tether-release-smoke"
          npm install \
            --prefix "$smoke_root" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            "$PWD/dist/$tarball"
          installed="$smoke_root/node_modules/@parcha/tether"
          python -m py_compile "$installed/runtime/slack_protocol.py"
          python -m py_compile "$installed/runtime/domain_schema.py"
          [[ "$(node "$installed/bin/tether.js" version)" == "tether $RELEASE_VERSION" ]]

          sha256="$(sha256sum "dist/$tarball" | awk '{print $1}')"
          [[ "$sha256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$sha256" "$tarball" >"dist/$tarball.sha256"
          [[ -z "$(git status --porcelain --untracked-files=no)" ]]

          printf 'tarball=%s\n' "$tarball" >>"$GITHUB_OUTPUT"
          printf 'sha256=%s\n' "$sha256" >>"$GITHUB_OUTPUT"
      - name: Upload the tested package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tether-package-${{ needs.identity.outputs.version }}
          path: |
            tether/dist/${{ steps.package.outputs.tarball }}
            tether/dist/${{ steps.package.outputs.tarball }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  npm-publish:
    name: Attest and publish to npm
    needs: [identity, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: npm-release
      url: https://www.npmjs.com/package/@parcha/tether/v/${{ needs.identity.outputs.version }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      NPM_DIST_TAG: ${{ needs.identity.outputs.npm_dist_tag }}
      TARBALL_NAME: ${{ needs.validate.outputs.tarball }}
      EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.RELEASE_NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
      - name: Pin trusted-publishing npm client
        run: npm install --global --ignore-scripts --no-audit --no-fund "npm@$RELEASE_NPM_VERSION"
      - name: Download the tested package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tether-package-${{ needs.identity.outputs.version }}
          path: dist
      - name: Verify the downloaded artifact
        run: |
          set -euo pipefail
          [[ "$TARBALL_NAME" == "parcha-tether-$RELEASE_VERSION.tgz" ]]
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ -f "dist/$TARBALL_NAME" && ! -L "dist/$TARBALL_NAME" ]]
          [[ -f "dist/$TARBALL_NAME.sha256" && ! -L "dist/$TARBALL_NAME.sha256" ]]
          [[ "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2 ]]
          (
            cd dist
            sha256sum --check "$TARBALL_NAME.sha256"
          )
          [[ "$(sha256sum "dist/$TARBALL_NAME" | awk '{print $1}')" == "$EXPECTED_SHA256" ]]
      - name: Attest the tested package artifact
        uses: actions/attest@36051bcae73b7c2a8a6945a48cbf80953c6baa35 # v4
        with:
          subject-path: dist/${{ needs.validate.outputs.tarball }}
      - name: Publish the tested tarball through npm OIDC
        run: |
          set -euo pipefail
          npm publish "dist/$TARBALL_NAME" \
            --access public \
            --provenance \
            --tag "$NPM_DIST_TAG"
      - name: Verify npm version and dist-tag
        run: |
          set -euo pipefail
          for _ in 1 2 3 4 5 6; do
            version="$(npm view "@parcha/tether@$RELEASE_VERSION" version 2>/dev/null || true)"
            dist_tag="$(npm view "@parcha/tether" "dist-tags.$NPM_DIST_TAG" 2>/dev/null || true)"
            if [[ "$version" == "$RELEASE_VERSION" && "$dist_tag" == "$RELEASE_VERSION" ]]; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::npm did not expose the expected version on dist-tag $NPM_DIST_TAG."
          exit 1

  github-release:
    name: Publish GitHub release
    needs: [identity, validate, npm-publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ needs.identity.outputs.version }}
      RELEASE_TAG: ${{ needs.identity.outputs.release_tag }}
      IS_PRERELEASE: ${{ needs.identity.outputs.prerelease }}
      TARBALL_NAME: ${{ needs.validate.outputs.tarball }}
      EXPECTED_SHA256: ${{ needs.validate.outputs.sha256 }}
    steps:
      - name: Download the tested package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tether-package-${{ needs.identity.outputs.version }}
          path: dist
      - name: Verify the downloaded artifact
        run: |
          set -euo pipefail
          [[ -f "dist/$TARBALL_NAME" && ! -L "dist/$TARBALL_NAME" ]]
          [[ -f "dist/$TARBALL_NAME.sha256" && ! -L "dist/$TARBALL_NAME.sha256" ]]
          [[ "$(find dist -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 2 ]]
          (
            cd dist
            sha256sum --check "$TARBALL_NAME.sha256"
          )
          [[ "$(sha256sum "dist/$TARBALL_NAME" | awk '{print $1}')" == "$EXPECTED_SHA256" ]]
      - name: Create the immutable GitHub release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::GitHub release $RELEASE_TAG already exists."
            exit 1
          fi
          flags=(
            --generate-notes
            --title "Tether $RELEASE_VERSION"
            --verify-tag
          )
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            flags+=(--prerelease)
          else
            flags+=(--latest)
          fi
          gh release create "$RELEASE_TAG" \
            "dist/$TARBALL_NAME" \
            "dist/$TARBALL_NAME.sha256" \
            "${flags[@]}"
      - name: Verify GitHub release classification
        run: |
          set -euo pipefail
          actual="$(
            gh release view "$RELEASE_TAG" \
              --json isDraft,isPrerelease,tagName \
              --jq '[.tagName, (.isDraft|tostring), (.isPrerelease|tostring)] | join("\t")'
          )"
          [[ "$actual" == "$RELEASE_TAG"$'\t'"false"$'\t'"$IS_PRERELEASE" ]]

name: tether-ci

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths:
      - "tether/**"
      - "package.json"
      - "README.md"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "scripts/prove_portability.py"
      - "tests/test_portability.py"
      - ".github/workflows/tether-ci.yml"
      - ".github/workflows/tether-release.yml"
      - ".github/SECURITY.md"
      - ".github/SUPPORT.md"
  pull_request:
    branches: ["main"]
    paths:
      - "tether/**"
      - "package.json"
      - "README.md"
      - ".agents/plugins/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "scripts/prove_portability.py"
      - "tests/test_portability.py"
      - ".github/workflows/tether-ci.yml"
      - ".github/workflows/tether-release.yml"
      - ".github/SECURITY.md"
      - ".github/SUPPORT.md"

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            node: "22"
          - python: "3.12"
            node: "24"
          - python: "3.13"
            node: "22"
          - python: "3.14"
            node: "24"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - run: python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
      - run: >-
          python -m pip install --disable-pip-version-check
          "bandit==1.8.6"
          "ruff==0.15.18"
      - run: ruff check tether/runtime tether/skills/tether/scripts tether/herdr-plugin tether/tests
      - run: bandit -q -r tether/runtime tether/skills/tether/scripts
      - run: python -m py_compile tether/runtime/slack_protocol.py
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tether
      - run: npm test
        working-directory: tether
      - run: npm pack --dry-run
        working-directory: tether

  repository-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
      - name: Install ShellCheck
        run: python -m pip install --disable-pip-version-check "shellcheck-py==0.10.0.1"
      - name: Check shell scripts
        run: shellcheck tether/install.sh tether/tests/*.sh
      - name: Check repository package inventory
        run: python -m unittest discover -s tests -p 'test_portability.py' -v
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tether
      - run: npm test
        working-directory: tether

  arm64:
    name: Native Linux arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Prove native architecture
        run: test "$(uname -m)" = "aarch64"
      - run: python -m pip install --disable-pip-version-check --upgrade "pip==26.1.2"
      - run: >-
          python -m pip install --disable-pip-version-check
          "bandit==1.8.6"
          "ruff==0.15.18"
      - run: ruff check tether/runtime tether/skills/tether/scripts tether/herdr-plugin tether/tests
      - run: bandit -q -r tether/runtime tether/skills/tether/scripts
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: tether
      - run: npm test
        working-directory: tether
      - run: npm pack --dry-run
        working-directory: tether

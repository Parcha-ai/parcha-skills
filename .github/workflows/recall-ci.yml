name: recall-ci

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths: ["recall/**", ".github/workflows/recall-ci.yml"]
  pull_request:
    branches: ["main"]
    paths: ["recall/**", ".github/workflows/recall-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: recall
    env:
      RECALL_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r server/requirements.txt -r collector/requirements.txt bandit pip-audit "ruff==0.15.18"
      - name: Notification passage handoff regression
        run: python server/tests/e2e_notification_passage_handoff.py
      - name: Independent message receipt regression
        run: python server/tests/e2e_identity_qualified_duplicates.py
      - name: Notification publication regression
        run: python server/tests/e2e_notification_priority.py
      - run: npm test
      - name: Synthetic agent namespace security regression
        run: sudo "$(command -v python)" server/tests/e2e_agent_namespace.py
      - run: ruff check . --select E9,F,PLE
      - run: bandit -q -lll -r . -x tests,server/tests
      - run: pip-audit -r server/requirements.txt -r collector/requirements.txt
      - name: Retired job-index lifecycle (isolated PostgreSQL 17)
        run: bash server/tests/run_job_status_index_fixture.sh
      - name: Parent fallback buffer proof (isolated PostgreSQL 16)
        run: bash server/tests/run_parent_fallback_fixture.sh
      - name: Fresh-PostgreSQL end-to-end suite
        env:
          DIAGNOSIS_OUTPUT: ${{ runner.temp }}
        run: |
          for test in \
            e2e_brainstore.py \
            e2e_source_status_index_order.py \
            e2e_v2_canonical_plane.py \
            e2e_slack_deletion_ordering.py \

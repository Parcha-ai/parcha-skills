name: recall-ci

permissions:
  contents: read

on:
  push:
    branches: ["main"]
    paths: ["recall/**", ".github/workflows/recall-ci.yml"]
  pull_request:
    branches: ["main"]
    paths: ["recall/**", ".github/workflows/recall-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg16
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: recall
    env:
      RECALL_DATABASE_URL: postgresql://postgres:synthetic-ci-password@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r server/requirements.txt bandit pip-audit "ruff==0.15.18"
      - run: npm test
      - run: ruff check . --select E9,F,PLE
      - run: bandit -q -lll -r . -x tests,server/tests
      - run: pip-audit -r server/requirements.txt
      - name: Fresh-PostgreSQL end-to-end suite
        run: |
          for test in \
            e2e_brainstore.py \
            e2e_v2_canonical_plane.py \
            e2e_storage_legacy_cut.py \
            e2e_canonical_body_thinning.py \
            e2e_bounded_canonical_thinning.py \
            e2e_committed_body_keys.py \
            e2e_logical_source_integrity.py \
            e2e_logical_source_fairness.py \
            e2e_logical_parent_fallback.py \
            e2e_cleanup_transaction_waves.py \
            e2e_archive_reprojection.py \
            e2e_v2_lifecycle.py \
            e2e_bulk_manifest.py \
            e2e_v2_isolation.py \
            e2e_v2_connector_writer.py \
            e2e_v2_multitenant_mcp.py \
            e2e_connector_control_web.py \
            e2e_employee_attribution.py \
            e2e_legacy_actor_backfill.py \
            e2e_session_source_l1.py \
            e2e_semantic_l2.py \
            e2e_capture_mcp.py \
            e2e_codex_projection.py \
            e2e_oversized_records.py \
            e2e_codex_archive_restore.py \
            e2e_parquet_scan_fragments.py \
            e2e_scan_upstream_completeness.py \
            e2e_search_outbox.py \
            e2e_search_plane_projection.py \
            e2e_slack_passage_visibility.py \
            e2e_connector_host.py \
            e2e_collector_health_deadline.py \
            e2e_integration_activation.py \
            e2e_connector_registry.py \
            e2e_connector_sdk.py \
            e2e_gmail_attachments.py \
            e2e_connector_supervisor.py \
            e2e_export_inbox.py \
            e2e_federation_ranking.py \
            e2e_grep_ai.py \
            e2e_imessage_connector.py \
            e2e_local_file_connectors.py \
            e2e_local_activity_connectors.py \
            e2e_portable_pim_imports.py \
            e2e_portable_service_archives.py \
            e2e_feed_and_jsonl_connectors.py \
            e2e_managed_auth_adapter.py \
            e2e_public_mcp_principal.py \
            e2e_webhook_ingest.py \
            e2e_remote_worker.py \
            e2e_managed_connector_worker.py \
            e2e_workspace_rail.py \
            e2e_retrieval_eval.py \
            e2e_passage_metadata.py \
            e2e_retire_postgres_plane.py \
            e2e_parent_scoped_retrieval.py \
            e2e_archived_chunk_reads.py \
            e2e_context_neighbor_work.py \
            e2e_pending_archived_chunks.py \
            e2e_chunk_body_locators.py \
            e2e_locator_spool.py \
            e2e_locator_backfill_plan.py \
            e2e_locator_backfill_apply.py \
            e2e_revision_history.py \
            e2e_chunk_retirement.py \
            e2e_chunk_vector_retirement.py \
            e2e_parent_chunk_retirement.py \
            e2e_optional_reconcile_index.py \
            e2e_context_time_index.py \
            e2e_streaming_locators.py \
            e2e_retirement_native_locks.py \
            e2e_context_neighbor_plan.py \
            e2e_located_public_reads.py \
            e2e_retirement_runner.py \
            e2e_archived_resolve.py
          do
            python "server/tests/$test"
          done
      - name: Immutable Recall Core container contract
        env:
          RECALL_CORE_IMAGE: recall-core:ci
        run: |
          docker build --pull --tag "$RECALL_CORE_IMAGE" --file Dockerfile .
          python server/tests/e2e_core_container.py
      - name: Recall Core image vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: recall-core:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - name: Remote worker container contract
        env:
          RECALL_REMOTE_WORKER_IMAGE: recall-remote-worker:ci
        run: |
          docker build --pull --tag "$RECALL_REMOTE_WORKER_IMAGE" --file Dockerfile.remote-worker .
          python server/tests/e2e_remote_worker_container.py
      - name: Remote worker image vulnerability gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: recall-remote-worker:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
      - run: npm pack --dry-run

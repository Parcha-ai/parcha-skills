name: recall-image

permissions:
  contents: read
  packages: write

on:
  push:
    branches: ["main"]
    paths:
      - "recall/Dockerfile"
      - "recall/.dockerignore"
      - "recall/server/**"
      - "recall/contracts/**"
      - "recall/connectors/**"
      - "recall/client/**"
      - "recall/collector/**"
      - "recall/privacy/**"
      - "recall/scripts/install_gws.py"
      - "recall/skills/recall/scripts/recall.py"
      - ".github/workflows/recall-image.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/recall-core" >> "$GITHUB_OUTPUT"
      - name: Fetch proprietary ATI brain-turn bundle
        env:
          ATI_BUNDLE_REPO: ${{ secrets.ATI_BUNDLE_REPO }}
          ATI_BUNDLE_REF: ${{ secrets.ATI_BUNDLE_REF }}
          ATI_BUNDLE_SHA256: ${{ secrets.ATI_BUNDLE_SHA256 }}
          ATI_BUNDLE_TOKEN: ${{ secrets.ATI_BUNDLE_TOKEN }}
        run: |
          if [ -z "$ATI_BUNDLE_TOKEN" ]; then
            echo "::warning::ATI_BUNDLE_* secrets are not configured; publishing image without the ATI brain-turn bundle."
          else
            bash recall/scripts/fetch_ati_bundle.sh recall/server/vendor/ati/grep_ati_brain_turn.mjs
          fi
      - uses: docker/build-push-action@v6
        with:
          context: recall
          file: recall/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
